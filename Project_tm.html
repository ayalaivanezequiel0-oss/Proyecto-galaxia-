
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TE QUIERO 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #01020a;
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#panel {
  position: absolute;
  top: 15px;
  left: 15px;
  pointer-events: none;
}

h2 {
  margin: 0;
  color: #b8dcff;
  font-size: 19px;
  text-shadow: 0 0 12px #238cff;
}

#info {
  margin-top: 6px;
  font-size: 12px;
  color: #c3d5ed;
}

#reset {
  position: absolute;
  top: 14px;
  right: 12px;
  padding: 10px;
  border: 1px solid #478bd1;
  border-radius: 8px;
  background: #10294a;
  color: white;
}

#help {
  position: absolute;
  bottom: 15px;
  left: 10px;
  right: 10px;
  text-align: center;
  font-size: 11px;
  color: #b9cce4;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="panel">
  <h2>UNIVERSO 3D</h2>
  <div id="info">Sistema Solar · Exploración espacial</div>
</div>

<button id="reset">Volver al inicio</button>

<div id="help">
  Arrastrá para girar · Usá dos dedos para alejar la cámara
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from
"three/addons/controls/OrbitControls.js";

// ===================================
// 1. ESCENA
// ===================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x01020a);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  20000
);

camera.position.set(0, 0, 65);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "low-power"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

document.body.appendChild(renderer.domElement);

// ===================================
// 2. CONTROLES
// ===================================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;

controls.minDistance = 20;
controls.maxDistance = 6500;

controls.target.set(0, 0, 0);

// ===================================
// 3. ILUMINACIÓN
// ===================================

scene.add(
  new THREE.AmbientLight(0xffffff, 0.8)
);

const sunLight = new THREE.PointLight(
  0xffc46b,
  3,
  150
);

scene.add(sunLight);

// ===================================
// 4. SOL
// ===================================

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 32, 32),
  new THREE.MeshBasicMaterial({
    color: 0xffb52e
  })
);

scene.add(sun);

const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(3, 24, 24),
  new THREE.MeshBasicMaterial({
    color: 0xff8125,
    transparent: true,
    opacity: 0.2
  })
);

scene.add(sunGlow);

// ===================================
// 5. PLANETAS
// ===================================

const planetData = [
  {
    name: "Mercurio",
    size: 0.35,
    distance: 4,
    color: 0xaaa49c,
    speed: 1.7
  },
  {
    name: "Venus",
    size: 0.58,
    distance: 6,
    color: 0xe5bd7d,
    speed: 1.3
  },
  {
    name: "Tierra",
    size: 0.65,
    distance: 8,
    color: 0x287bdf,
    speed: 1
  },
  {
    name: "Marte",
    size: 0.48,
    distance: 10.5,
    color: 0xd66b43,
    speed: 0.8
  },
  {
    name: "Júpiter",
    size: 1.3,
    distance: 14,
    color: 0xc99c75,
    speed: 0.5
  },
  {
    name: "Saturno",
    size: 1.1,
    distance: 18,
    color: 0xe1c58c,
    speed: 0.35
  },
  {
    name: "Urano",
    size: 0.85,
    distance: 22,
    color: 0x78cbd2,
    speed: 0.25
  },
  {
    name: "Neptuno",
    size: 0.8,
    distance: 26,
    color: 0x3155cc,
    speed: 0.18
  }
];

const planets = [];

for (const data of planetData) {

  // ÓRBITAS EN EL PLANO XY

  const points = [];

  for (let i = 0; i < 100; i++) {

    const angle = i / 100 * Math.PI * 2;

    points.push(
      new THREE.Vector3(
        Math.cos(angle) * data.distance,
        Math.sin(angle) * data.distance,
        0
      )
    );
  }

  const orbit = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({
      color: 0x526783,
      transparent: true,
      opacity: 0.4
    })
  );

  scene.add(orbit);

  // PLANETA

  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(
      data.size,
      20,
      20
    ),
    new THREE.MeshStandardMaterial({
      color: data.color,
      roughness: 0.85
    })
  );

  scene.add(planet);

  // ANILLOS DE SATURNO

  if (data.name === "Saturno") {

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.5, 2.2, 48),
      new THREE.MeshBasicMaterial({
        color: 0xd8c39a,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      })
    );

    planet.add(ring);
  }

  planets.push({
    mesh: planet,
    distance: data.distance,
    speed: data.speed,
    angle: Math.random() * Math.PI * 2
  });
}

// ===================================
// 6. ESTRELLAS DEL ESPACIO PROFUNDO
// ===================================

const distantPositions = [];
const distantColors = [];

for (let i = 0; i < 2200; i++) {

  const radius = 150 + Math.random() * 1500;

  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  const x = radius * Math.sin(phi) * Math.cos(theta);
  const y = radius * Math.sin(phi) * Math.sin(theta);
  const z = radius * Math.cos(phi);

  distantPositions.push(x, y, z);

  const tint = Math.random();

  distantColors.push(
    0.65 + tint * 0.35,
    0.75 + tint * 0.25,
    1
  );
}

const distantGeometry = new THREE.BufferGeometry();

distantGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    distantPositions, 3
  )
);

distantGeometry.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    distantColors, 3
  )
);

const distantStars = new THREE.Points(
  distantGeometry,
  new THREE.PointsMaterial({
    size: 1.2,
    vertexColors: true,
    sizeAttenuation: false
  })
);

scene.add(distantStars);

// ===================================
// 7. MENSAJE TE QUIERO
// ===================================

function createMessage() {

  const canvas = document.createElement("canvas");

  canvas.width = 1600;
  canvas.height = 400;

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, 1600, 400);

  ctx.fillStyle = "white";

  ctx.font = "bold 220px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "TE QUIERO",
    800,
    200
  );

  const pixels = ctx.getImageData(
    0, 0, 1600, 400
  ).data;

  const positions = [];
  const colors = [];

  // Cada punto luminoso representa una estrella.

  for (let y = 0; y < 400; y += 6) {

    for (let x = 0; x < 1600; x += 6) {

      const index = (y * 1600 + x) * 4;

      if (pixels[index + 3] > 100) {

        const px = (x - 800) * 4.2;
        const py = (200 - y) * 4.2;

        // UBICACIÓN LEJANA DEL MENSAJE

        const pz = -3500 +
          (Math.random() - 0.5) * 2;

        positions.push(
          px + (Math.random() - 0.5) * 1.5,
          py + (Math.random() - 0.5) * 1.5,
          pz
        );

        const brightness = 0.7 + Math.random() * 0.3;

        colors.push(
          brightness,
          brightness,
          1
        );
      }
    }
  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions, 3
    )
  );

  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
      colors, 3
    )
  );

  const material = new THREE.PointsMaterial({
    size: 2,
    vertexColors: true,
    transparent: true,
    opacity: 0,
    sizeAttenuation: false,
    depthWrite: false
  });

  const message = new THREE.Points(
    geometry,
    material
  );

  scene.add(message);

  return material;
}

const messageMaterial = createMessage();

// ===================================
// 8. ANIMACIÓN
// ===================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  // MOVIMIENTO PLANETARIO

  for (const p of planets) {

    p.angle += p.speed * delta * 0.25;

    p.mesh.position.set(
      Math.cos(p.angle) * p.distance,
      Math.sin(p.angle) * p.distance,
      0
    );
  }

  // DISTANCIA DE LA CÁMARA

  const distance = camera.position.distanceTo(
    controls.target
  );

  // APARICIÓN PROGRESIVA DEL MENSAJE

  const visibility = THREE.MathUtils.clamp(
    (distance - 1200) / 1000,
    0,
    1
  );

  messageMaterial.opacity = visibility;

  // INFORMACIÓN

  const info = document.getElementById("info");

  if (distance < 100) {

    info.textContent =
      "Sistema Solar · Exploración planetaria";

  } else if (distance < 1200) {

    info.textContent =
      "Viajando por el espacio profundo...";

  } else {

    info.textContent =
      "Has descubierto un mensaje entre las estrellas";
  }

  sun.rotation.y += delta * 0.15;
  sunGlow.rotation.y += delta * 0.1;

  controls.update();

  renderer.render(scene, camera);
}

animate();

// ===================================
// 9. REGRESAR AL INICIO
// ===================================

document.getElementById("reset").addEventListener(
  "click",
  () => {

    camera.position.set(0, 0, 65);

    controls.target.set(0, 0, 0);

    controls.update();
  }
);

// ===================================
// 10. ADAPTACIÓN A ANDROID
// ===================================

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
